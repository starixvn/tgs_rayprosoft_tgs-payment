apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "payment.fullname" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "ConnectionStrings": {
        "Tgs": "{{ .Values.connectionStrings.tgs }}"
        "Nats": "{{ .Values.connectionStrings.nats }}"
      }
    }