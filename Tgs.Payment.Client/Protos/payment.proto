syntax = "proto3";

option csharp_namespace = "Tgs.Payment.Protos";
package payment;

message DepositRequest {
	string apply_info = 1;
	string amount = 2;
}

message DepositResponse {
	string result = 1;
}

message WithdrawRequest {
	string apply_info = 1;
	string amount = 2;
}

message WithdrawResponse {
	string result = 1;
}

message GeneralRequest {
	string content = 1;
}

message GeneralResponse {
	string result = 1;
}

message ApproveDepositRequest {
	string form_id = 1;
	string brand_id = 2;
}

message FormEvent {
	string form_id = 1;
	string brand_id = 2;
}

message FormThirdNoEvent {
	string form_id = 1;
	string third_party_order_no = 2;
}
