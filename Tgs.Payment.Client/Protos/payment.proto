syntax = "proto3";

option csharp_namespace = "Tgs.Payment.Protos";
package payment;

import "phoenix/protobuf/guid.proto";
import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

message DepositRequest {
	string apply_info = 1;
	string amount = 2;
}

message DepositResponse {
	string result = 1;
}

message WithdrawRequest {
	string apply_info = 1;
	string amount = 2;
}

message WithdrawResponse {
	string result = 1;
}

message GeneralRequest {
	string content = 1;
}

message GeneralResponse {
	string result = 1;
}

message ApproveDepositRequest {
	string form_id = 1;
	string brand_id = 2;
	phoenix.protobuf.DecimalValue actual_amount = 3;
}

message FormEvent {
	string form_id = 1;
	string brand_id = 2;
}

message FormThirdNoRequest {
	phoenix.protobuf.GuidValue form_id = 1;
	string third_party_order_no = 2;
}

message TagPaidRequest {
	phoenix.protobuf.GuidValue form_id = 1;
}

message ScheduleRequest{
	phoenix.protobuf.GuidValue form_id = 1;
	google.protobuf.Timestamp excute_time = 2;
}

