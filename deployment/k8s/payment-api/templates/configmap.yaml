apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "payment.fullname" . }}
data:
  appsettings.json: |
    {
      "ConnectionStrings": {
        "Tgs": "{{ .Values.connectionStrings.tgs }}",
        "RedisConfigurationString": "{{ .Values.connectionStrings.redis }}",
        "Nats": "{{ .Values.connectionStrings.nats }}"
      }
    }