apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "payment.fullname" . }}
data:
  appsettings.json: |
    {
      "BankInfoParsers": {
        "Crypto": {
          "Address": "$.address"
        },
        "Bank": {
          "BankName": "$.bankName",
          "BankAccount": "$.bankAccount"
        },
        "FPS": {
          "Type": "FPS",
          "Phone": "$.phone"
        },
        "ThirdParty": {
          "Type": "ThirdParty",
          "Phone": "$.phone"
        },
        "Pulsa": {
          "Type": "Pulsa",
          "Phone": "$.phone"
        },
        "EWallet": {
          "Type": "EWallet",
          "Phone": "$.phone"
        }
      }
    }
  monitor.settings.json: |
    {
      "Logging":{
        "Console": {
          "FormatterName": "json",
          "FormatterOptions": {
            "IncludeScopes": "True",
            "TimestampFormat": "HH:mm:ss "
          }
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
